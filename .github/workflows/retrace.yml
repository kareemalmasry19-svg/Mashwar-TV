name: Retrace crash

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit the crashing APK was built from
        required: true
      trace:
        description: Stack trace lines (use \n between lines)
        required: true

jobs:
  retrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Retrace
        env:
          TRACE: ${{ inputs.trace }}
        run: |
          printf '%b\n' "$TRACE" > crash.txt
          RETRACE=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/retrace 2>/dev/null | head -1)
          echo "=========== RETRACED ==========="
          "$RETRACE" app/build/outputs/mapping/release/mapping.txt crash.txt
          echo "=========== MAPPING HITS ==========="
          for c in $(grep -o 'at [A-Za-z0-9_$.]*\.[a-zA-Z0-9_$]*(' crash.txt | sed 's/^at //; s/\.[^.]*($//' | sort -u); do
            grep -E "^[^ ].* -> ${c//./\\.}:$" app/build/outputs/mapping/release/mapping.txt || true
          done
