name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk MashwarTV-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MashwarTV-apk
          path: MashwarTV-debug.apk
      # Direct download link: Releases ▸ latest (tag "latest-debug" is replaced on every build)
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug MashwarTV-debug.apk \
            --title "MashwarTV debug (${GITHUB_SHA::7})" \
            --notes "آخر نسخة تجريبية متبنية من main." --latest
