name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testReleaseUnitTest assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk KenueTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KenueTV-apk
          path: KenueTV.apk
      # Direct download link: Releases ▸ latest (tag "latest" is replaced on every build)
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KenueTV.apk \
            --title "Kenue TV (${GITHUB_SHA::7})" \
            --notes "آخر نسخة متبنية من main." --latest
